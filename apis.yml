aid: surge-therapeutics
name: SURGE Therapeutics
description: 'SURGE Therapeutics is a clinical-stage biotechnology company based in Cambridge,
  Massachusetts, developing intraoperative cancer immunotherapy. Founded on research from
  Dr. Michael Goldberg''s laboratory at Harvard Medical School, the company''s SURGERx platform
  is an injectable, biodegradable hydrogel placed directly at the site of surgical tumor
  resection to provide extended, localized release of immunotherapy — addressing the
  surgery-induced inflammation that suppresses the immune system and allows residual disease
  to reawaken. Its lead program, SRG-514, completed Phase 1 dose escalation in breast cancer
  patients undergoing surgery and is being prepared for a registrational trial, with an
  additional IND cleared for a Phase 1/2a study in bladder cancer. SURGE has raised a $26M
  Series A and a $32M Series B. It is a therapeutics developer, not a software company, and
  publishes no developer program, API, or machine-readable interface.'
